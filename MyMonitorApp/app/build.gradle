plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.monitorapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.monitorapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // ⚠️ এই লাইনটি নতুন যোগ করা (এটি Render-এর লিংক APK-তে পাঠাবে)
        buildConfigField "String", "API_ENDPOINT", "\"https://my-monitor-app-dashboard.vercel.app/api/logs\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
