name: Build Custom APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        required: true
      package_name:
        required: true
      webview_url:
        required: true
      api_endpoint:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: app/build/outputs/apk/debug/*.apk
